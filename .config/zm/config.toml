# zm config. zm reloads it when you save; mistakes show as "Config error" in the menu.

[defocus]
# When one of these apps is frontmost and its last window closes or is minimized,
# zm moves focus to the most recently used app that still has a window.
# Find an app's bundle ID with: osascript -e 'id of app "Name"'
apps = [
  "com.spotify.client",                  # Spotify
  "com.grailr.CARROTweather",            # CARROT Weather (iPhone app)
  "com.apple.MobileSMS",                 # Messages
  "com.hnc.Discord",                     # Discord
  "org.whispersystems.signal-desktop",   # Signal
  "com.yahoo.finance",                   # Yahoo Finance (iPhone app)
  "com.markmcguill.strongbox.pro",       # Strongbox
  "com.apple.finder",                    # Finder
]

[quit_on_close]
# When one of these apps is frontmost and you close its last window, zm quits it (like
# Cmd-Q; it may still ask to save). Minimizing doesn't count. iPhone apps are never quit.
apps = [
  "net.sourceforge.skim-app.skim",       # Skim
  "com.interversehq.qView",              # qView
  "com.apple.Preview",                   # Preview
]

[audio]
# zm keeps the default output and input on the first connected device in each list,
# and switches back if macOS or an app changes them (menu bar ZM > Pause audio pinning to pick
# by hand). A device missing from a list is never used for that direction. Alert
# sounds follow the output.
# Entries: { uid = "..." } (exact, survives renames) or { name = "..." } (ignoring case);
# a plain string matches either. `make audio-devices` in the zm repo lists both. A name in
# both lists, like the Yeti's, means its output half in `output` and its mic in `input`.
output = [
  { uid = "34-0E-22-8C-38-CC:output" },       # zpods (AirPods)
  { uid = "BuiltInHeadphoneOutputDevice" },   # External Headphones (the headphone jack)
  { uid = "BuiltInSpeakerDevice" },           # MacBook Pro Speakers
  { name = "Yeti Stereo Microphone" },        # the Yeti's headphone jack
]
input = [
  { name = "Yeti Stereo Microphone" },
  { uid = "34-0E-22-8C-38-CC:input" },        # zpods mic (puts the AirPods in call quality while recording)
  { uid = "BuiltInMicrophoneDevice" },        # MacBook Pro Microphone
]

[dns]
# zm keeps these services' DNS on `servers` and puts it back if anything changes it (menu bar
# ZM > Pause DNS guard to change it by hand); every 5 minutes it checks the servers answer.
# Services by hardware address (`make network-services` in the zm repo lists them).
servers = ["127.0.0.1"]
services = [
  { mac = "5c:e9:1e:bd:90:f1" },   # Wi-Fi
  { mac = "64:4b:f0:60:4d:0e" },   # the dock's Ethernet
]

[dns.domains]
# Every *.test name goes to dnsmasq, whatever DNS the network uses.
test = "127.0.0.1"

[loopback]
# Addresses for the local sites in local-services.conf (newtab.test, blog.test), kept from boot.
aliases = ["127.1.0.1", "127.1.0.2"]
